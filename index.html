<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skautská výprava</title>
  <style>
    :root {
      --bg: #1a1e1b;
      --card-bg: #272d28;
      --text: #e8ece9;
      --accent: #4caf50;
      --accent-hover: #43a047;
      --error: #e53935;
      --border: #3d463e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(76, 175, 80, 0.2);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #cfd8d1;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      background: #191c19;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1.25rem;
      color: #fff;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    input.shake {
      animation: shake 0.4s ease-in-out;
      border-color: var(--error);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }
    .highlight-box {
      background: #1d231e;
      border-left: 4px solid var(--accent);
      padding: 14px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card" id="card-content">
    <span class="badge">Stanoviště 1</span>
    <h1>Úkol č. 1</h1>
    <p>Sečtěte výšky pouze dvouslovných vrcholů, které lze zahlédnout severním směrem od rozhledny – výsledek zapište níže.</p>
    <form onsubmit="handleCheck(event, 1)">
      <div class="input-group">
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="input-1" placeholder="Zadejte výsledek" autocomplete="off" autofocus>
        <button type="submit">Ověřit odpověď</button>
      </div>
    </form>
  </div>

  <script>
    const H1 = "62f6d46c48c7d9ff3d09a408d0ec880f167a5dc9c8fd343a4e56e96318349583";
    const H2 = "71ee45a3c0db9a9865f7313dd3372cf60dca6479d46261f3542eb9346e4a04d6";
    const D2 = "BEpGWVcWW1VXS0oLGltXXF5TGgdlTFhYV09f/ZhC/KIWCgUZS0lXVgc8BFEHBvqsU1ZaGP27FhkEBBZeCQc8BEkIc11PS1AWThl8+5RaV0/1kVQWWfyIGFRZWxnytVRDW1FXVBlcXV1TVhlFVljzhlBAXVMWSFZaUVpXUk0YGGnzoVBGSlhATFwWS1waGPyIXRlcXUpCVFAWSxlA+5hbURlG/aBfUl1TGFfyo1NXU/qLGElEV1ta+5BbFBlFTFhYXRlFXRlA+5hbGElZXFZUVvqXGFdTUFZSWRlcWVIWUlxbTRcWbRlEV0NeVFxSVkAWVlhcXFxCXRlcXVFZGElZVVf1lf27XVIYGHJZVFBdGFtPGE1ZVUwWSFZaUVpXUk1ZTlAWVFxCV0oWWkBaVwYW2rmlGE/1hUpaXV1TUxlMWUlf/ZhCXRlY+5TzhlwYBBZGBjMKXlZEVRlZVkpDWlRfTAQUUFhYXFVTe1FTW1IeXU9TVk0aGAsfGgc8GBkKXFBAGFpaWUpFBRtfVklDTBRRSlZDSBsIMhkWGBkKUVdGTU0WTEBGXQQUTFxaGhlfVklDTFRZXFwLGldDVVxEUVoUGElXTE1TSlcLGmIGFQBrEhsWUV0LGlBYSExCFQsUGElaWVpTUFZaXFxEBRtsWV1TUk1TGE/yo1IUGFhDTFZVV1RGVFxCXQQUV19QGhlXTU1ZXlZVTUoIMhkWGBkKWkxCTFZYGE1PSFwLGkpDWlRfTBsId0/yo/yvUU0WV11GV0/yo/25BBZUTU1CV1cIMhkWBBZSUU8IMgUZXlZEVQc=";
    const D3 = "CEdEVVoUV1hVR0cJFlZVUFNRFhRHQE1YUQkWVlVXX1NGW0FaUA4URlNWVRwDAhgFAwEYDAQYBBoHAR0PFgr3rkdE8K9XXAgbR0RVWgo+CFwFCmdERveVQlrwrxUIG1wFCj4IRApwW0FS95VZGBTxilEUR1EUQFHwuxRB8YoUV1z3lURRWVEaFGRbR1hRUFr3mRRAUUdAFFxYUVBRXkBRFEJOUEHxlVpbQRTwuVVGW0EUBRgEDBRfWRRA95lZQFsUR1nwr0ZRWQ4IG0QKPghQXUIUV1hVR0cJFlxdU1xYXVNcQBlWW0wWCj4UFAhcBhRHQE1YUQkWV1tYW0YOFEJVRhwZGVVXV1FaQB0PFFJbWkAZR11OUQ4UBkZRWQ8UWVVGU11aGVZbQEBbWQ4UAERMDxYKAAL2hAgbXAYKPhQUCEdEVVoUR0BNWFEJFlJbWkAZQ1FdU1xADhQBBAQPFFdbWFtGDhQXUlJSDxYK8axRX1rwr0BRFFpVFFn3mUdA8K8YFPGKURRWTUdAURRG95VQXRReUVBaQRRYVVxRQhRkVVpbREBdX1UaCBtECg==";

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function decrypt(b64, key) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
      }
      return new TextDecoder().decode(bytes);
    }

    async function handleCheck(e, stepNum) {
      e.preventDefault();
      const input = document.getElementById('input-' + stepNum);
      const val = input.value.replace(/\s+/g, '');
      const hash = await sha256(val);

      if (stepNum === 1 && hash === H1) {
        document.getElementById('card-content').innerHTML = decrypt(D2, val);
        const next = document.getElementById('input-2');
        if (next) next.focus();
      } else if (stepNum === 2 && hash === H2) {
        document.getElementById('card-content').innerHTML = decrypt(D3, val);
      } else {
        input.classList.add('shake');
        setTimeout(() => {
          input.classList.remove('shake');
          input.value = '';
          input.focus();
        }, 450);
      }
    }
  </script>
</body>
</html>
